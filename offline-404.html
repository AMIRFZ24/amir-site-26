<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<title>صفحه پیدا نشد</title>
<script>
(function(){try{
  var d=document.documentElement,t=null;
  try{t=localStorage.getItem('thm')}catch(e){}
  if(t!=='dark'&&t!=='light'){try{t=localStorage.getItem('th')}catch(e){}}
  if(t==='dark'||t==='light')d.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<style>
:root{
  --bg:#f4f6fb;--tx:#14182b;--mu:#5b6482;
  --glass:rgba(255,255,255,.62);--bd:rgba(30,40,80,.12);--sh:0 20px 60px rgba(40,60,120,.18);
  --b1:#5b7cff;--b2:#8b5cf6;--o1:rgba(91,124,255,.28);--o2:rgba(139,92,246,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220;--tx:#fff;--mu:#c3cae6;--glass:rgba(22,27,50,.6);--bd:rgba(255,255,255,.16);--sh:0 20px 60px rgba(0,0,0,.5);--o1:rgba(91,124,255,.3);--o2:rgba(139,92,246,.26)}}
:root[data-theme="dark"]{--bg:#0f1220;--tx:#fff;--mu:#c3cae6;--glass:rgba(22,27,50,.6);--bd:rgba(255,255,255,.16);--sh:0 20px 60px rgba(0,0,0,.5);--o1:rgba(91,124,255,.3);--o2:rgba(139,92,246,.26)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100%;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Vazirmatn",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  overflow:hidden;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.orb{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb.a{top:-25vmax;left:-20vmax;background:var(--o1)}
.orb.b{bottom:-28vmax;right:-22vmax;background:var(--o2)}
.card{
  position:relative;z-index:1;width:min(92vw,400px);text-align:center;
  padding:36px 26px 30px;border-radius:30px;
  background:var(--glass);border:1px solid var(--bd);box-shadow:var(--sh);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
}
.sphere-wrap{position:relative;width:132px;height:132px;margin:0 auto 18px;animation:float 3.8s ease-in-out infinite}
.sphere-wrap::before{
  content:"";position:absolute;inset:-14px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(110,140,255,.55),rgba(150,100,255,.25) 55%,transparent 72%);
  filter:blur(12px);animation:glow 2.8s ease-in-out infinite;
}
.sphere-wrap svg{position:relative;z-index:1;width:100%;height:100%;display:block}
.shadow{width:84px;height:12px;margin:-4px auto 18px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(6px);animation:shadow 3.8s ease-in-out infinite}
:root:not([data-theme="dark"]) .shadow{background:rgba(40,60,120,.28)}
.code{font-size:15px;font-weight:700;letter-spacing:4px;color:var(--mu);margin-bottom:6px;direction:ltr;animation:fadeUp .7s .15s cubic-bezier(.2,.8,.2,1) both}
h1{font-size:24px;font-weight:800;margin-bottom:10px;animation:fadeUp .7s .25s cubic-bezier(.2,.8,.2,1) both}
p{font-size:14px;line-height:2;color:var(--mu);margin-bottom:24px;animation:fadeUp .7s .35s cubic-bezier(.2,.8,.2,1) both}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
  border-radius:999px;text-decoration:none;color:#fff;font-weight:800;font-size:15px;
  background:linear-gradient(90deg,var(--b1),var(--b2));
  box-shadow:0 10px 26px -10px rgba(91,124,255,.8);
  transition:transform .2s ease,opacity .2s ease;animation:fadeUp .7s .45s cubic-bezier(.2,.8,.2,1) both;
}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(.8);opacity:.4}}
@keyframes glow{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important}}
</style>
</head>
<body>
<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<main class="card" role="main">
  <div class="sphere-wrap" aria-hidden="true">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sph" cx=".34" cy=".27" r=".85">
          <stop offset="0" stop-color="#e0f2fe"/>
          <stop offset=".28" stop-color="#60a5fa"/>
          <stop offset=".65" stop-color="#4f46e5"/>
          <stop offset="1" stop-color="#2e1065"/>
        </radialGradient>
        <radialGradient id="rim" cx=".75" cy=".85" r=".55">
          <stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/>
          <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="60" cy="60" r="52" fill="url(#sph)"/>
      <circle cx="60" cy="60" r="52" fill="url(#rim)"/>
      <ellipse cx="44" cy="36" rx="20" ry="11" fill="#fff" opacity=".35" transform="rotate(-28 44 36)"/>
      <circle cx="60" cy="60" r="55" fill="none" stroke="#a78bfa" stroke-opacity=".55" stroke-width="2"/>
      <path d="M60 36v30" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="60" cy="81" r="4.6" fill="#fff"/>
    </svg>
  </div>
  <div class="shadow" aria-hidden="true"></div>
  <div class="code">404</div>
  <h1>صفحه پیدا نشد</h1>
  <p>شما آفلاین هستید یا آدرس اشتباه است.</p>
  <a class="btn" href="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>بازگشت به خانه</span>
  </a>
</main>
</body>
</html>
